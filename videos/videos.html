<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Video — Khyati17</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://i.ytimg.com" crossorigin />
  <link rel="preconnect" href="https://www.youtube.com" />
  <!-- SEO + social share preview: meta description, Open Graph & Twitter Card tags. (khyati:seo-meta) -->
  <meta name="description" content="Watch free YouTube Shorts on Khyati17." />
  <meta name="theme-color" content="#6a1b9a" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Khyati17" />
  <meta property="og:title" content="🎬 Video — Khyati17" />
  <meta property="og:description" content="Watch free YouTube Shorts on Khyati17." />
  <meta property="og:image" content="https://khyati17.com/og-image.png" />
  <meta property="og:url" content="https://khyati17.com/videos/videos.html" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <!-- This page is the single-video reader. Opened on its own with no
       ?video=<id>, send visitors to the VideoZone hub instead; the hub
       links here with ?video=<id> to watch a specific video. -->
  <script>
    (function(){
      try{
        if(!new URLSearchParams(location.search).get('video')){
          location.replace('/videos/index.html');
        }
      }catch(e){ /* if anything goes wrong, just show the reader */ }
    })();
  </script>
  <link rel="stylesheet" href="../assets/css/styles.css" />
  <style>
    :root{ --pp:#6a1b9a; --pp2:#9c4dcc; --ink:#2b0b3a; }
    .v-main{ max-width:760px; margin:0 auto; padding:18px 16px 48px; }
    .v-box{ background:#fff; border-radius:16px; overflow:hidden; box-shadow:0 6px 18px rgba(0,0,0,.06); }
    .v-player{ position:relative; aspect-ratio:16/9; background:#000; }
    .v-player iframe{ width:100%; height:100%; border:0; display:block; }
    .v-info{ padding:14px 16px; }
    .v-info h1{ margin:0 0 4px; color:var(--pp); font-size:1.2rem; }
    .v-info .ch{ color:#8a76a3; font-size:.85rem; }
    .v-actions{ display:flex; gap:8px; flex-wrap:wrap; margin-top:10px }
    .v-comments{ padding:0 16px 18px; }
    .v-comments h4{ margin:14px 0 10px; color:var(--ink); }
    .v-another{ text-align:center; margin:20px 0 4px }
    .v-crumb{ font-size:.82rem; margin-bottom:14px }
    .v-crumb a{ color:#6a1b9a; font-weight:600 }
  </style>
  <!-- canonical + site icon (khyati:head) -->
  <link rel="canonical" href="https://khyati17.com/videos/videos.html" />
  <script type="application/ld+json" id="video-jsonld"></script>
</head>
<body>
  <div id="site-header-root"></div>

  <main class="v-main">
    <p class="v-crumb"><a href="/videos/index.html">🎬 VideoZone</a> / <span id="v-crumb-title">Video</span></p>
    <div class="v-box">
      <div class="v-player">
        <div id="v-player-mount"></div>
      </div>
      <div class="v-info">
        <h1 id="v-title"></h1>
        <div class="ch" id="v-channel"></div>
        <div class="v-actions">
          <button id="v-share" class="btn btn-ghost" style="font-size:.82rem;padding:6px 14px">🔗 Share video</button>
        </div>
      </div>
      <div class="v-comments">
        <h4>Comments</h4>
        <div id="comments-list" style="margin-bottom:12px"></div>
        <div id="comment-form-wrapper"></div>
      </div>
    </div>
    <div class="v-another"><button id="v-another-btn" class="btn">🎲 Watch another video</button></div>
  </main>

  <footer class="site-footer">
    <p>© <span id="year"></span> Khyati17 — All rights reserved</p>
  </footer>

  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
  <script type="module" src="../assets/js/auth.js?v=2"></script>
  <script type="module">import('../assets/js/loadHeader.js').then(m=>m.loadSharedHeader());</script>
  <script type="module">
    import { VIDEOS as BAKED } from './videos-data.js?v=1';
    import { fetchComments, renderCommentsInto, renderCommentForm } from '../assets/js/comments.js?v=2';

    function loadVideos(){
      const list = BAKED.map(v => ({ ...v, ytid:v.id, embed:`https://www.youtube.com/embed/${v.id}?autoplay=1&rel=0`, thumb:`https://i.ytimg.com/vi/${v.id}/hqdefault.jpg` }));
      let admin = [];
      try{ admin = JSON.parse(localStorage.getItem('khyati_videos_admin') || '[]'); }catch(e){ admin = []; }
      admin.forEach(a=>{
        const url = a.embed || a.link || '';
        const m = String(url).match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/);
        const id = m ? m[1] : null;
        list.unshift({
          id: id || ('added-'+(a.created_at||Math.random())),
          ytid: id || null,
          title: a.title || 'New Video',
          channel: 'Added by owner',
          cat: 'More',
          embed: id ? `https://www.youtube.com/embed/${id}?autoplay=1&rel=0` : url,
          thumb: a.thumbnail || (id ? `https://i.ytimg.com/vi/${id}/hqdefault.jpg` : '')
        });
      });
      return list;
    }
    const VIDS = loadVideos();

    function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

    const mount = document.getElementById('v-player-mount');
    // Load the YouTube IFrame Player API so we can force sound ON (browsers
    // mute plain autoplay; the API lets us unmute + set volume after the user
    // opens the video, which counts as the required interaction).
    let ytReady = new Promise(res=>{ window.onYouTubeIframeAPIReady = ()=>res(); });
    (function(){ const s=document.createElement('script'); s.src='https://www.youtube.com/iframe_api'; document.head.appendChild(s); })();
    let player = null;
    let currentVideo = null;

    // Per-video SEO: give each ?video=<id> its own canonical URL, title and
    // description, the same way stories.html does per ?story=<slug>, so each
    // video is individually bookmarkable/shareable and indexable.
    function updateVideoMeta(v){
      const title = (v.title || 'Video') + ' — Khyati17';
      const desc = `Watch "${v.title}" by ${v.channel} — free on Khyati17.`;
      const url = 'https://khyati17.com/videos/videos.html?video=' + encodeURIComponent(v.id);
      document.title = title;
      const canon = document.querySelector('link[rel="canonical"]');
      if(canon) canon.setAttribute('href', url);
      const setMeta = (sel, attr, val) => { const el = document.querySelector(sel); if(el) el.setAttribute(attr, val); };
      setMeta('meta[name="description"]', 'content', desc);
      setMeta('meta[property="og:title"]', 'content', title);
      setMeta('meta[property="og:description"]', 'content', desc);
      setMeta('meta[property="og:url"]', 'content', url);
      if(v.thumb) setMeta('meta[property="og:image"]', 'content', v.thumb);
      const jsonld = document.getElementById('video-jsonld');
      if(jsonld) jsonld.textContent = JSON.stringify({
        '@context': 'https://schema.org',
        '@type': 'VideoObject',
        name: v.title,
        description: desc,
        thumbnailUrl: v.thumb || undefined,
        url,
      });
    }

    function showVideo(v, { pushHistory = true } = {}){
      currentVideo = v;
      document.getElementById('v-title').textContent = v.title;
      document.getElementById('v-channel').textContent = v.channel;
      document.getElementById('v-crumb-title').textContent = v.title;
      updateVideoMeta(v);
      if(pushHistory){
        const url = 'videos.html?video=' + encodeURIComponent(v.id);
        if(location.search !== '?video=' + encodeURIComponent(v.id)) history.pushState({video:v.id}, '', url);
      }
      try{ if(player && player.destroy) player.destroy(); }catch(_){}
      player = null;
      if(v.ytid){
        mount.innerHTML = '<div id="yt-player"></div>';
        ytReady.then(()=>{
          if(currentVideo !== v) return; // a newer video was opened before the API finished loading
          player = new YT.Player('yt-player', {
            videoId: v.ytid, width:'100%', height:'100%',
            playerVars:{ autoplay:1, rel:0, playsinline:1 },
            events:{ onReady:(e)=>{ try{ e.target.unMute(); e.target.setVolume(100); e.target.playVideo(); }catch(_){} } }
          });
        });
      } else {
        mount.innerHTML = `<iframe src="${v.embed}" title="${esc(v.title)}" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>`;
      }
      window.scrollTo({top:0, behavior:'smooth'});
      // comments for this video
      (async ()=>{
        const list = document.getElementById('comments-list');
        const comments = await fetchComments('video', v.id);
        renderCommentsInto(list, comments);
        renderCommentForm(document.getElementById('comment-form-wrapper'), 'video', v.id, list);
      })();
    }

    document.getElementById('v-another-btn').addEventListener('click', ()=>{
      if(VIDS.length < 2){ return; }
      let pick; do { pick = VIDS[Math.floor(Math.random()*VIDS.length)]; } while(currentVideo && pick.id === currentVideo.id);
      showVideo(pick);
    });

    document.getElementById('v-share').addEventListener('click', async ()=>{
      if(!currentVideo) return;
      const shareUrl = 'https://khyati17.com/videos/videos.html?video=' + encodeURIComponent(currentVideo.id);
      const data = { title: currentVideo.title + ' — Khyati17', text: 'Watch this on Khyati17!', url: shareUrl };
      const btn = document.getElementById('v-share');
      if(navigator.share){ try{ await navigator.share(data); return; }catch(e){} }
      try{ await navigator.clipboard.writeText(shareUrl); btn.textContent = '✅ Link copied!'; }
      catch(e){ btn.textContent = 'Press Ctrl+C'; }
      setTimeout(()=>{ btn.textContent = '🔗 Share video'; }, 1600);
    });

    // Back/forward button support when moving between videos via "watch another".
    window.addEventListener('popstate', ()=>{
      const id = new URLSearchParams(location.search).get('video');
      if(id){ const v = VIDS.find(x=>x.id===id); if(v) showVideo(v, {pushHistory:false}); }
    });

    document.addEventListener('DOMContentLoaded', async ()=>{
      if(window.AuthReady) try{ await window.AuthReady }catch(e){}
      const id = new URLSearchParams(location.search).get('video');
      const v = id ? VIDS.find(x=>x.id===id) : null;
      if(v) showVideo(v, {pushHistory:false});
      else if(id) { document.getElementById('v-title').textContent = "Video not found"; document.getElementById('v-info') && (document.getElementById('v-info').innerHTML = '<p>This video may have been removed. <a href="/videos/index.html">Browse VideoZone</a> instead.</p>'); }
    });
  </script>
</body>
</html>
