<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>🎬 VideoZone — Videos</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <!-- speed up the many YouTube thumbnails -->
  <link rel="preconnect" href="https://i.ytimg.com" crossorigin />
  <link rel="dns-prefetch" href="https://i.ytimg.com" />
  <!-- SEO + social share preview: meta description, Open Graph & Twitter Card tags. (khyati:seo-meta) -->
  <meta name="description" content="Browse 700+ free YouTube Shorts in the Khyati17 VideoZone — tap any video to watch on its own page." />
  <meta name="theme-color" content="#6a1b9a" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Khyati17" />
  <meta property="og:title" content="🎬 VideoZone — Khyati17" />
  <meta property="og:description" content="Browse 700+ free YouTube Shorts — tap any video to watch on its own page." />
  <meta property="og:image" content="https://khyati17.com/og-image.png" />
  <meta property="og:url" content="https://khyati17.com/videos/index.html" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <link rel="stylesheet" href="../assets/css/styles.css" />
  <style>
    :root{ --pp:#6a1b9a; --pp2:#9c4dcc; --acc:#e9d8ff; --ink:#2b0b3a; }
    .v-main{ max-width:1100px; margin:0 auto; padding:18px 16px 48px; }
    .v-head{ text-align:center; margin:8px 0 18px; }
    .v-head h1{ font-size:clamp(1.6rem,4vw,2.3rem); color:var(--pp); margin:0; }
    .v-head p{ color:#6b5b7e; margin:8px 0 0; }
    .zone-nav{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:14px}
    .zone-nav a{color:#5a3d77;background:#f3e9fd;border-radius:999px;padding:6px 12px;font-size:.8rem;font-weight:500;white-space:nowrap;transition:background .15s}
    .zone-nav a:hover{background:#e9d8ff}
    .v-controls{ display:flex; flex-direction:column; gap:12px; margin-bottom:18px; }
    #v-search{ width:100%; max-width:520px; margin:0 auto; padding:11px 16px; border:1px solid #d9c7ee; border-radius:999px; font-family:inherit; font-size:.95rem; }
    #v-search:focus{ outline:none; border-color:var(--pp2); }
    .v-chips{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
    .v-chip{ cursor:pointer; user-select:none; border:1px solid #ead9fb; background:#faf5ff; color:#5a3d77; border-radius:999px; padding:7px 14px; font-size:.85rem; font-weight:500; }
    .v-chip.active{ background:linear-gradient(90deg,var(--pp),var(--pp2)); color:#fff; border-color:transparent; }

    #admin-area:empty{ display:none; }
    #admin-area{ max-width:560px; margin:0 auto 18px; }

    .v-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:16px; }
    .v-card{ cursor:pointer; background:#fff; border:1px solid #eee; border-radius:14px; overflow:hidden; box-shadow:0 4px 14px rgba(117,80,168,.08); transition:transform .15s, box-shadow .15s; }
    .v-card:hover{ transform:translateY(-4px); box-shadow:0 14px 28px rgba(117,80,168,.18); }
    .v-thumb{ position:relative; aspect-ratio:16/9; background:#222; overflow:hidden; }
    .v-thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
    .v-thumb .play{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:2.4rem; color:#fff; text-shadow:0 2px 8px rgba(0,0,0,.5); opacity:.92; }
    .v-thumb .badge{ position:absolute; top:8px; left:8px; background:rgba(106,27,154,.85); color:#fff; font-size:.62rem; font-weight:600; padding:3px 8px; border-radius:999px; }
    .v-meta{ padding:10px 12px; }
    .v-title{ font-size:.86rem; font-weight:600; color:var(--ink); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .v-channel{ font-size:.72rem; color:#8a76a3; margin-top:4px; }
    .v-empty{ grid-column:1/-1; text-align:center; color:#8a76a3; padding:40px 0; }
  </style>
  <!-- canonical + site icon (khyati:head) -->
  <link rel="canonical" href="https://khyati17.com/videos/index.html" />
  <script type="application/ld+json">
  {"@context":"https://schema.org","@type":"CollectionPage","name":"VideoZone — 700+ Free Videos","url":"https://khyati17.com/videos/index.html","description":"700+ free YouTube Shorts to watch on Khyati17 — animals, satisfying, sports, magic, science and more.","isPartOf":{"@type":"WebSite","name":"Khyati17","url":"https://khyati17.com/"},"inLanguage":"en"}
  </script>
</head>
<body>
  <div id="site-header-root"></div>

  <main class="v-main">
    <div class="v-head">
      <h1>🎬 VideoZone</h1>
      <p>Tap any video to watch it on its own page — bookmark, share, and comment.</p>
    </div>

    <nav class="zone-nav" aria-label="Site sections">
      <a href="/">🏠 Home</a>
      <a href="/fun-games/index.html">🎮 GameZone</a>
      <a href="/ai-tools/index.html">🤖 AI Zone</a>
      <a href="/stories/index.html">📖 Story Hub</a>
    </nav>

    <div id="admin-area"></div>

    <div style="text-align:center;margin:0 0 12px"><button id="v-surprise" type="button" style="background:linear-gradient(90deg,#6a1b9a,#9c4dcc);color:#fff;border:none;font-weight:700;cursor:pointer;border-radius:999px;padding:9px 20px;font-size:.9rem;box-shadow:0 6px 16px rgba(117,80,168,.3)">🎲 Surprise me — play a random video</button></div>

    <div class="v-controls">
      <input id="v-search" type="search" placeholder="Search videos…" autocomplete="off" aria-label="Search videos" />
      <div class="v-chips" id="v-chips"></div>
    </div>

    <div class="v-grid" id="v-grid"></div>
  </main>

  <footer class="site-footer">
    <p>© <span id="year"></span> Khyati17 — All rights reserved</p>
  </footer>

  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
  <script type="module" src="../assets/js/auth.js?v=2"></script>
  <script type="module">import('../assets/js/loadHeader.js').then(m=>m.loadSharedHeader());</script>
  <script type="module">
    import { VIDEOS as BAKED } from './videos-data.js?v=1';
    import adminModule from '../assets/js/admin.js';

    const CAT_EMOJI = { "Animals":"🐾","Satisfying":"🌀","Sports":"🏀","Magic":"🪄","Science":"🔬","Soccer":"⚽","Food":"🍳","Art":"🎨","Life Hacks":"💡","More":"🎬" };

    function ytId(url){ if(!url) return null; const m = String(url).match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/); return m ? m[1] : null; }

    function loadVideos(){
      const list = BAKED.map(v => ({ ...v, ytid:v.id, embed:`https://www.youtube.com/embed/${v.id}?autoplay=1&rel=0`, thumb:`https://i.ytimg.com/vi/${v.id}/hqdefault.jpg` }));
      let admin = [];
      try{ admin = JSON.parse(localStorage.getItem('khyati_videos_admin') || '[]'); }catch(e){ admin = []; }
      admin.forEach(a=>{
        const url = a.embed || a.link || '';
        const id = ytId(url);
        list.unshift({
          id: id || ('added-'+(a.created_at||Math.random())),
          ytid: id || null,
          title: a.title || 'New Video',
          channel: 'Added by owner',
          cat: 'More',
          embed: id ? `https://www.youtube.com/embed/${id}?autoplay=1&rel=0` : url,
          thumb: a.thumbnail || (id ? `https://i.ytimg.com/vi/${id}/hqdefault.jpg` : '')
        });
      });
      return list;
    }

    let VIDS = loadVideos();
    let activeCat = "All", query = "";

    function categories(){ return ["All", ...[...new Set(VIDS.map(v=>v.cat))].sort()]; }

    const grid = document.getElementById('v-grid');
    const chipsEl = document.getElementById('v-chips');

    function renderChips(){
      chipsEl.innerHTML = "";
      categories().forEach(cat=>{
        const b = document.createElement('button'); b.className = 'v-chip'+(cat===activeCat?' active':'');
        b.textContent = cat==='All' ? 'All' : (CAT_EMOJI[cat]||'') + ' ' + cat;
        b.onclick = ()=>{ activeCat = cat; render(); };
        chipsEl.appendChild(b);
      });
    }

    const openVideo = v => { location.href = 'videos.html?video=' + encodeURIComponent(v.id); };

    const V_PAGE = 48;
    let _vList = [], _vShown = 0;
    function buildVideoCard(v){
      const card = document.createElement('div'); card.className = 'v-card';
      const thumb = v.thumb ? `<img src="${v.thumb}" alt="${esc(v.title || 'Video thumbnail')}" loading="lazy" decoding="async" onerror="this.style.display='none'"/>` : '';
      card.innerHTML =
        `<div class="v-thumb">${thumb}<div class="play">▶</div><div class="badge">${CAT_EMOJI[v.cat]||''} ${v.cat}</div></div>`+
        `<div class="v-meta"><div class="v-title">${esc(v.title)}</div><div class="v-channel">${esc(v.channel)}</div></div>`;
      card.onclick = ()=> openVideo(v);
      return card;
    }
    function appendVideoBatch(){
      const end = Math.min(_vShown + V_PAGE, _vList.length);
      for(let i=_vShown;i<end;i++) grid.appendChild(buildVideoCard(_vList[i]));
      _vShown = end;
      let wrap = document.getElementById('vLoadMore');
      if(!wrap){ wrap = document.createElement('div'); wrap.id='vLoadMore'; wrap.style.cssText='text-align:center;margin:22px 0 4px'; grid.parentNode.insertBefore(wrap, grid.nextSibling); }
      wrap.innerHTML = '';
      if(_vShown < _vList.length){
        const btn = document.createElement('button'); btn.textContent = 'Load more videos ('+(_vList.length-_vShown)+' more) ↓';
        btn.style.cssText='background:linear-gradient(90deg,#6a1b9a,#9c4dcc);color:#fff;border:none;border-radius:999px;padding:11px 26px;font-weight:700;cursor:pointer;font-size:.92rem;box-shadow:0 6px 16px rgba(117,80,168,.3)';
        btn.onclick = appendVideoBatch; wrap.appendChild(btn);
      }
    }
    function render(){
      renderChips();
      grid.innerHTML = "";
      _vList = VIDS.filter(v=>{
        const okCat = activeCat==='All' || v.cat===activeCat;
        const hay = (v.title + ' ' + v.channel + ' ' + v.cat).toLowerCase();
        return okCat && hay.includes(query);
      });
      if(!_vList.length){ grid.innerHTML = '<div class="v-empty">No videos match your search 😕</div>'; const w=document.getElementById('vLoadMore'); if(w) w.innerHTML=''; return; }
      _vShown = 0;
      appendVideoBatch();
    }

    function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

    document.getElementById('v-search').addEventListener('input', e=>{ query = e.target.value.trim().toLowerCase(); render(); });
    document.getElementById('v-surprise').addEventListener('click', ()=>{ if(VIDS.length) openVideo(VIDS[Math.floor(Math.random()*VIDS.length)]); });

    render();

    document.addEventListener('DOMContentLoaded', async ()=>{
      if(window.AuthReady) try{ await window.AuthReady }catch(e){}
      try{ await adminModule.mountAdminUI('videos'); VIDS = loadVideos(); render(); }catch(e){/* ignore */}
    });
  </script>
</body>
</html>
