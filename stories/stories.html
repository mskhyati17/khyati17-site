<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Stories</title>
  <!-- SEO + social share preview: meta description, Open Graph & Twitter Card tags. (khyati:seo-meta) -->
  <meta name="description" content="Read original short stories on Khyati17 — free, family-friendly tales you can enjoy in your browser." />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Khyati17" />
  <meta property="og:title" content="Stories" />
  <meta property="og:description" content="Read original short stories on Khyati17 — free, family-friendly tales you can enjoy in your browser." />
  <meta property="og:image" content="https://khyati17.com/og-image.png" />
  <meta property="og:url" content="https://khyati17.com/stories/stories.html" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Stories" />
  <meta name="twitter:description" content="Read original short stories on Khyati17 — free, family-friendly tales you can enjoy in your browser." />
  <meta name="twitter:image" content="https://khyati17.com/og-image.png" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <!-- This page is the single-story reader. Opened on its own (e.g. via an old
       cached menu link or bookmark), send visitors to the Story Hub instead;
       the hub links here with ?story=<slug> to read a specific story. -->
  <script>
    (function(){
      try{
        if(!new URLSearchParams(location.search).get('story')){
          location.replace('/stories/index.html');
        }
      }catch(e){ /* if anything goes wrong, just show the reader */ }
    })();
  </script>
  <link rel="stylesheet" href="../assets/css/styles.css" />
  <style>
    /* keep the reader from overflowing on phones (stacks the sidebar) */
    #story-content{word-wrap:break-word;overflow-wrap:break-word}
    #story-content img{max-width:100%;height:auto}
    @media (max-width:700px){
      .stories-layout{flex-direction:column !important;gap:12px !important}
      #stories-list{width:auto !important;min-width:0 !important;max-height:220px !important}
      .stories-layout > div{width:auto !important}
    }
  </style>
  <!-- canonical + site icon (khyati:head) -->
  <link rel="canonical" href="https://khyati17.com/stories/stories.html" />
  <script type="application/ld+json" id="story-jsonld"></script>
</head>
<body>
  <div id="site-header-root"></div>

  <main class="hero">
    <h2>Stories</h2>
    <p>Purple-themed place for stories and more.</p>

    <section class="stories-layout" style="margin-top:18px;display:flex;gap:18px;max-width:1200px;margin-left:auto;margin-right:auto">
      <aside id="stories-list" style="width:25%;min-width:220px;max-height:70vh;overflow:auto;background:rgba(154,68,204,0.02);padding:12px;border-radius:8px">
        <h3 style="margin-top:0">Stories</h3>
        <div id="stories-list-container"></div>
      </aside>

      <div style="width:75%;min-height:400px;display:flex;flex-direction:column">
        <div id="admin-area" style="margin-bottom:12px"></div>
        <article id="story-content" style="background:#fff;padding:16px;border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,0.06);overflow:auto;max-height:70vh"></article>
        <div id="comments-area" class="comments-area" style="margin-top:12px">
          <h4 style="margin:6px 0 12px">Comments</h4>
          <div id="comments-list" style="margin-bottom:12px"></div>
          <div id="comment-form-wrapper"></div>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>© <span id="year"></span> Khyati17 — All rights reserved</p>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
  <script type="module" src="../assets/js/auth.js?v=2"></script>
  <script type="module">import('../assets/js/loadHeader.js').then(m=>m.loadSharedHeader());</script>
  <script type="module">
    import { fetchComments, renderCommentsInto, renderCommentForm } from '../assets/js/comments.js?v=2';
    import adminModule from '../assets/js/admin.js';
    // bump the ?v= version whenever stories-data.js changes (see index.html)
    import { STORIES as BAKED } from './stories-data.js?v=20260626a';

    const slugOf = s => s.slug || s.id || (s.title||'').replace(/\s+/g,'-').toLowerCase();
    let ALL_STORIES = [];

    // Estimate reading time from the story body (~200 words/min).
    function readingTime(html){
      const words = String(html||'').replace(/<[^>]+>/g,' ').trim().split(/\s+/).filter(Boolean).length;
      return Math.max(1, Math.round(words/200));
    }

    async function loadStories(){
      let extra = [];
      if(window.supabase){
        try{ const { data, error } = await window.supabase.from('stories').select('*').order('created_at', {ascending:false}); if(!error && data) extra = data; }
        catch(e){ console.warn('supabase fetch stories failed', e); }
      } else {
        extra = JSON.parse(localStorage.getItem('khyati_stories_admin')||'[]');
      }
      // Baked-in stories first, then any extras that aren't already baked in.
      const stories = [...BAKED];
      const have = new Set(stories.map(slugOf));
      (extra||[]).forEach(s=>{ if(!have.has(slugOf(s))) stories.push(s); });
      ALL_STORIES = stories;
      const container = document.getElementById('stories-list-container'); container.innerHTML = '';
      stories.forEach(s=>{
        const a = document.createElement('div'); a.style.padding='8px'; a.style.cursor='pointer'; a.style.borderBottom='1px solid rgba(106,27,154,0.04)';
        a.textContent = s.title || s.slug || '(untitled)';
        a.addEventListener('click', ()=> showStory(s));
        container.appendChild(a);
      });
      // If the Story Hub linked us to a specific story (?story=<slug>), open it;
      // otherwise fall back to the first/most-recent story.
      const wanted = new URLSearchParams(location.search).get('story');
      const idOf = s => s.slug || s.id || (s.title||'').replace(/\s+/g,'-').toLowerCase();
      const target = wanted ? stories.find(s=> idOf(s) === wanted) : null;
      const toShow = target || stories[0];
      if(toShow) showStory(toShow);
    }

    // Per-story SEO: give each ?story=<slug> its own canonical URL, title and
    // description so search engines index stories individually instead of
    // collapsing them all onto this one static page.
    function updateStoryMeta(s, slug){
      const title = (s.title||'Story') + ' — Khyati17';
      const desc = s.excerpt || ('Read "' + (s.title||'this story') + '" — a free original story on Khyati17.');
      const url = 'https://khyati17.com/stories/stories.html?story=' + encodeURIComponent(slug);
      document.title = title;
      const canon = document.querySelector('link[rel="canonical"]');
      if(canon) canon.setAttribute('href', url);
      const setMeta = (sel, attr, val) => { const el = document.querySelector(sel); if(el) el.setAttribute(attr, val); };
      setMeta('meta[name="description"]', 'content', desc);
      setMeta('meta[property="og:title"]', 'content', title);
      setMeta('meta[property="og:description"]', 'content', desc);
      setMeta('meta[property="og:url"]', 'content', url);
      setMeta('meta[name="twitter:title"]', 'content', title);
      setMeta('meta[name="twitter:description"]', 'content', desc);
      const jsonld = document.getElementById('story-jsonld');
      if(jsonld) jsonld.textContent = JSON.stringify({
        '@context': 'https://schema.org',
        '@type': 'Article',
        headline: s.title || 'Story',
        description: desc,
        url,
        author: { '@type': 'Person', name: 'Khyati Srivastava' },
        publisher: { '@type': 'Organization', name: 'Khyati17', url: 'https://khyati17.com/' },
        isAccessibleForFree: true
      });
    }

    function showStory(s){
      const el = document.getElementById('story-content');
      if(!el) return;
      Reader.stop(); // switching stories cancels any speech from the previous one
      const slug = s.slug || s.id || (s.title||'').replace(/\s+/g,'-').toLowerCase();
      updateStoryMeta(s, slug);
      const mins = readingTime(s.body);
      const meta = `<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:2px 0 10px;font-size:.8rem;color:#8a6fb0">`
        + (s.category ? `<span style="background:#f3e9fd;color:#6a1b9a;font-weight:700;border-radius:999px;padding:3px 10px">${escapeHtml(s.category)}</span>` : '')
        + `<span>⏱️ ${mins} min read</span></div>`;
      el.innerHTML = `<h2>${escapeHtml(s.title||'')}</h2>${meta}<p style="color:#6a4b8f">${escapeHtml(s.excerpt||'')}</p>`
        + `<div style="display:flex;gap:8px;flex-wrap:wrap;margin:2px 0 12px">`
        + `<button id="story-share" class="btn btn-ghost" style="font-size:.85rem;padding:6px 14px">🔗 Share story</button>`
        + `<button id="story-read" class="btn btn-ghost" style="font-size:.85rem;padding:6px 14px">🔊 Read aloud</button>`
        + `</div>`
        + `<div id="read-aloud-help" style="display:none;background:#fff8e6;border:1px solid #f3ddab;border-radius:10px;padding:10px 14px;margin:-4px 0 14px;font-size:.82rem;color:#6a4b8f;line-height:1.5"></div>`
        + `<div>${s.body||''}</div>`
        + `<div style="margin:22px 0 6px;text-align:center"><button id="story-another" class="btn" style="font-size:.9rem">🎲 Read another story</button></div>`;
      Reader.bind(document.getElementById('story-read'), s);
      // "Read another" opens a random different story
      const another = document.getElementById('story-another');
      if(another) another.addEventListener('click', ()=>{
        if(ALL_STORIES.length < 2){ return; }
        let pick; do { pick = ALL_STORIES[Math.floor(Math.random()*ALL_STORIES.length)]; } while(slugOf(pick) === slug);
        showStory(pick);
        el.scrollIntoView({behavior:'smooth', block:'start'});
      });
      // wire the share button (native share on mobile, copy link elsewhere)
      const sb = document.getElementById('story-share');
      if(sb) sb.addEventListener('click', async ()=>{
        const shareUrl = 'https://khyati17.com/stories/stories.html?story=' + encodeURIComponent(slug);
        const data = { title: (s.title||'A story') + ' — Khyati17', text: s.excerpt || 'Read this story on Khyati17!', url: shareUrl };
        if(navigator.share){ try{ await navigator.share(data); return; }catch(e){} }
        try{ await navigator.clipboard.writeText(shareUrl); sb.textContent='✅ Link copied!'; }
        catch(e){ sb.textContent='Press Ctrl+C'; }
        setTimeout(()=>{ sb.textContent='🔗 Share story'; }, 1600);
      });
      // set a data-content-id for comments to pick up
      el.setAttribute('data-content-id', slug);
      // load comments for this story
      (async ()=>{
        const cid = el.getAttribute('data-content-id');
        const comments = await fetchComments('story', cid);
        const commentsList = document.getElementById('comments-list');
        renderCommentsInto(commentsList, comments);
        // render the comment form (sign-in prompt or textarea + post)
        renderCommentForm(document.getElementById('comment-form-wrapper'), 'story', cid, commentsList);
      })();
    }

    // simple HTML escaper
    function escapeHtml(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

    // ---- Read Aloud: the browser's own text-to-speech (Web Speech API).
    // No account, no server, no setup — it just uses whatever voice engine
    // is already built into the visitor's browser/OS.
    const Reader = (() => {
      const supported = typeof window !== 'undefined' && !!window.speechSynthesis && typeof window.SpeechSynthesisUtterance === 'function';
      let queue = [], idx = 0, state = 'idle', btn = null, helpEl = null;
      // Chrome has a well-known bug where it silently stops speaking (fires
      // "end" almost instantly, no audio, no error) if the SpeechSynthesisUtterance
      // gets garbage-collected — which can happen because nothing else in JS
      // holds a reference to it once the function that created it returns.
      // Keeping one in this outer variable pins it alive for its whole lifetime.
      let currentUtterance = null;

      // ---- Backup voice: if the OS/browser has no working native voice, fall
      // back to meSpeak.js — a text-to-speech engine that synthesizes audio
      // itself via the Web Audio API, so it needs nothing installed on the
      // visitor's device. It's lazy-loaded (~3MB) only the first time it's
      // actually needed, and sounds noticeably more robotic than a real voice
      // — that trade-off is the whole point: zero install, ever.
      const MESPEAK_BASE = 'https://cdn.jsdelivr.net/npm/mespeak@1.9.6/';
      let usingFallback = false, nativeKnownBroken = false;
      let fallbackReady = false, fallbackLoadPromise = null;

      // meSpeak plays audio through a lazily-created AudioContext, created
      // only once the network loading above has finished — well outside the
      // original click's "user gesture" window. Browsers require an
      // AudioContext to start/resume within a gesture or it stays silently
      // suspended (no error, no sound — exactly the symptom reported). The
      // fix: synchronously play a silent blip on click, before any await.
      // Once real audio has played from a gesture, browsers generally allow
      // the page's later AudioContexts to play without a fresh gesture too.
      let audioUnlocked = false;
      function unlockAudioOnce(){
        if(audioUnlocked) return;
        audioUnlocked = true;
        try{
          const Ctx = window.AudioContext || window.webkitAudioContext;
          if(!Ctx) return;
          const ctx = new Ctx();
          const buffer = ctx.createBuffer(1, 1, 22050);
          const src = ctx.createBufferSource();
          src.buffer = buffer; src.connect(ctx.destination); src.start(0);
          if(ctx.resume) ctx.resume().catch(()=>{});
        }catch(e){ /* ignore — best-effort unlock */ }
      }

      function loadScriptOnce(src){
        return new Promise((resolve, reject) => {
          if(document.querySelector(`script[src="${src}"]`)){ resolve(); return; }
          const el = document.createElement('script');
          el.src = src; el.onload = () => resolve(); el.onerror = () => reject(new Error('failed to load ' + src));
          document.head.appendChild(el);
        });
      }
      // meSpeak's loadConfig(url) — unlike loadVoice(url, callback) — takes no
      // callback at all; completion has to be polled via isConfigLoaded().
      function waitUntil(checkFn, timeoutMs){
        return new Promise((resolve, reject) => {
          const startedAt = Date.now();
          (function poll(){
            if(checkFn()) return resolve();
            if(Date.now() - startedAt > timeoutMs) return reject(new Error('timed out waiting'));
            setTimeout(poll, 60);
          })();
        });
      }
      function ensureFallback(){
        if(fallbackReady) return Promise.resolve(true);
        if(fallbackLoadPromise) return fallbackLoadPromise;
        fallbackLoadPromise = (async () => {
          try{
            if(!window.meSpeak) await loadScriptOnce(MESPEAK_BASE + 'mespeak.js');
            if(!window.meSpeak.isConfigLoaded()){
              window.meSpeak.loadConfig(MESPEAK_BASE + 'mespeak_config.json');
              await waitUntil(() => window.meSpeak.isConfigLoaded(), 15000);
            }
            if(!window.meSpeak.isVoiceLoaded()){
              const ok = await new Promise(res => window.meSpeak.loadVoice(MESPEAK_BASE + 'voices/en/en-us.json', success => res(success)));
              if(!ok) throw new Error('voice failed to load');
            }
            fallbackReady = true;
            return true;
          }catch(e){
            console.warn('Read aloud: backup voice failed to load', e);
            return false;
          }
        })();
        return fallbackLoadPromise;
      }
      function showFallbackNotice(){
        if(!helpEl) return;
        helpEl.innerHTML = '🔊 Using a backup voice built into this page — it sounds a little robotic, but needs nothing installed.';
        helpEl.style.display = 'block';
        setTimeout(() => { if(usingFallback) helpEl.style.display = 'none'; }, 4500);
      }
      function fallbackSpeakNext(){
        if(idx >= queue.length){ stop(); return; }
        const text = queue[idx];
        window.meSpeak.speak(text, { rate: 165, amplitude: 100 }, success => {
          if(state !== 'speaking' || !usingFallback) return; // paused/stopped/switched mid-chunk
          if(!success){ fail(true); return; }
          idx++; fallbackSpeakNext();
        });
      }
      async function startFallback(){
        nativeKnownBroken = true;
        setLabel('⏳ Loading backup voice…');
        const ok = await ensureFallback();
        if(state !== 'speaking') return; // user hit stop/paused/switched story while loading
        if(!ok){ fail(true); return; }
        usingFallback = true;
        setLabel('⏸️ Pause reading (backup voice)');
        showFallbackNotice();
        fallbackSpeakNext();
      }

      // Chrome has a long-standing bug where a single very long utterance can
      // silently stop partway through. Splitting into sentence-ish chunks and
      // chaining them via onend sidesteps it and also makes pause/resume feel
      // more responsive.
      function chunkText(text){
        const sentences = text.match(/[^.!?\n]+[.!?\n]*/g) || [text];
        const chunks = []; let cur = '';
        for(const part of sentences){
          if((cur + part).length > 220 && cur){ chunks.push(cur.trim()); cur = ''; }
          cur += part;
        }
        if(cur.trim()) chunks.push(cur.trim());
        return chunks.length ? chunks : [text];
      }

      function textFromStory(s){
        const div = document.createElement('div'); div.innerHTML = s.body || '';
        const plain = (div.textContent || div.innerText || '').replace(/\s+/g,' ').trim();
        return `${s.title||'Story'}. ${plain}`;
      }

      function setLabel(text){ if(btn) btn.textContent = text; }

      function osHelpText(){
        const ua = navigator.userAgent || '';
        if(/Windows/i.test(ua)){
          return '🔇 <strong>No voice found</strong> — Windows doesn\'t have a text-to-speech voice installed/selected. Try <a href="ms-settings:speech" style="color:#6a1b9a;font-weight:600">Open Speech Settings</a> (or search "Speech settings" in the Start menu), make sure a voice is installed, then reload this page.';
        }
        if(/Macintosh|Mac OS X/i.test(ua)){
          return '🔇 <strong>No voice found</strong> — open <strong>System Settings → Accessibility → Spoken Content</strong>, pick a system voice, then reload this page.';
        }
        return '🔇 <strong>No voice found</strong> — your device doesn\'t seem to have a text-to-speech voice available. Check your system\'s accessibility/speech settings, then reload this page.';
      }
      function showHelp(){ if(helpEl){ helpEl.innerHTML = osHelpText(); helpEl.style.display = 'block'; } }
      function hideHelp(){ if(helpEl) helpEl.style.display = 'none'; }

      function speakNext(){
        if(idx >= queue.length){ stop(); return; }
        const text = queue[idx];
        const startedAt = Date.now();
        const u = new SpeechSynthesisUtterance(text);
        currentUtterance = u; // pin — see note above
        u.rate = 0.95;
        u.onend = () => {
          // Some Windows Chrome/Edge setups with no working TTS voice fire
          // "end" almost instantly instead of erroring — no audio, no error,
          // just an immediate silent "success". A real voice can't finish a
          // chunk this fast, so treat a suspiciously-quick end as a failure
          // instead of racing through the rest of the story in a flash.
          const elapsed = Date.now() - startedAt;
          const minPlausibleMs = Math.max(300, text.length * 8);
          if(elapsed < minPlausibleMs){
            console.warn(`Read aloud: chunk "ended" in ${elapsed}ms (too fast for ${text.length} chars) — no native voice available, trying backup`);
            startFallback();
            return;
          }
          idx++; speakNext();
        };
        u.onerror = e => {
          console.warn('Read aloud: native speech failed, trying backup', e && e.error);
          startFallback();
        };
        speechSynthesis.speak(u);
      }

      function fail(noVoice){
        queue = []; idx = 0; state = 'idle'; currentUtterance = null; usingFallback = false;
        setLabel(noVoice ? '🔇 No voice found on this device' : "⚠️ Couldn't play — tap to retry");
        if(noVoice) showHelp();
        setTimeout(() => { if(state === 'idle') setLabel('🔊 Read aloud'); }, 3200);
      }

      function start(s){
        hideHelp();
        usingFallback = false;
        queue = chunkText(textFromStory(s)); idx = 0; state = 'speaking';
        // Once we've confirmed this browser/OS has no working native voice,
        // don't waste time retrying it on every subsequent story — go
        // straight to the backup voice.
        if(nativeKnownBroken || !supported){ startFallback(); return; }
        setLabel('⏸️ Pause reading');
        const wasActive = speechSynthesis.speaking || speechSynthesis.pending;
        if(wasActive){
          // A short delay after cancel() avoids a Chrome quirk where speak()
          // called immediately after cancel() can silently produce no audio.
          speechSynthesis.cancel();
          setTimeout(speakNext, 60);
        } else {
          speakNext();
        }
      }
      function pause(){
        if(state!=='speaking') return;
        if(usingFallback){ try{ window.meSpeak.resetQueue(); }catch(e){} state='paused'; setLabel('▶️ Resume reading'); return; }
        if(!supported) return;
        speechSynthesis.pause(); state='paused'; setLabel('▶️ Resume reading');
      }
      function resume(){
        if(state!=='paused') return;
        if(usingFallback){ state='speaking'; setLabel('⏸️ Pause reading (backup voice)'); fallbackSpeakNext(); return; }
        if(!supported) return;
        speechSynthesis.resume(); state='speaking'; setLabel('⏸️ Pause reading');
      }
      function stop(){
        if(usingFallback){ try{ window.meSpeak.resetQueue(); }catch(e){} }
        if(supported) speechSynthesis.cancel();
        queue=[]; idx=0; state='idle'; currentUtterance=null; usingFallback=false; setLabel('🔊 Read aloud'); hideHelp();
      }

      function bind(button, s){
        btn = button;
        helpEl = document.getElementById('read-aloud-help');
        if(!button) return;
        // Even with no native speechSynthesis at all, the backup voice (see
        // above) can still read the story — so the button always stays live.
        setLabel('🔊 Read aloud');
        button.addEventListener('click', () => {
          unlockAudioOnce(); // must run synchronously inside the click, before any await
          if(state === 'idle') start(s);
          else if(state === 'speaking') pause();
          else if(state === 'paused') resume();
        });
      }

      window.addEventListener('pagehide', stop);
      window.addEventListener('beforeunload', stop);
      if(supported){
        // Voices load asynchronously in some browsers; calling getVoices() early
        // (rather than only at the moment of the first click) gives the browser
        // a head start so the list is more likely ready by the time we speak.
        try{ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices(); }catch(e){}
      }

      return { bind, stop };
    })();

    document.addEventListener('DOMContentLoaded', async ()=>{
      if(window.AuthReady) try{ await window.AuthReady }catch(e){}
      await loadStories();
      // mount admin UI if current user is admin
      try{ await adminModule.mountAdminUI('stories'); }catch(e){/* ignore */}
    });
    
  </script>
</body>
</html>
